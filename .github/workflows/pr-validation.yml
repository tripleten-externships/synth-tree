name: PR Validation

on:
  pull_request:
    branches:
      - development
      - main

permissions:
  contents: read
  pull-requests: write

env:
  AWS_REGION: us-east-1
  NODE_VERSION: "24"
  PNPM_VERSION: "10"

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      infra: ${{ steps.filter.outputs.infra }}
      api: ${{ steps.filter.outputs.api }}
      frontend: ${{ steps.filter.outputs.frontend }}
      ui: ${{ steps.filter.outputs.ui }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            infra:
              - 'apps/infra/**'
            # Root workspace/config files and this workflow affect every app,
            # so changes to them must run the api and frontend jobs too.
            api:
              - 'apps/api/**'
              - 'packages/api-types/**'
              - '.github/workflows/pr-validation.yml'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'tsconfig*.json'
            frontend:
              - 'apps/admin-dashboard/**'
              - 'apps/client-frontend/**'
              - 'packages/**'
              - '.github/workflows/pr-validation.yml'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'tsconfig*.json'
            ui:
              - 'packages/ui/**'
              - 'packages/theme/**'

  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: |
          echo "Running ESLint..."
          pnpm run lint
          echo "✅ Linting complete"

      # @synth-tree/theme and @synth-tree/ui resolve their types from dist/,
      # so they must be built before ui and admin-dashboard can type-check.
      - name: Build theme library
        working-directory: packages/theme
        run: pnpm build

      - name: Build component library
        working-directory: packages/ui
        run: pnpm build

      - name: Run TypeScript type check
        run: |
          echo "Running TypeScript type check..."
          pnpm run type-check
          echo "✅ Type check complete"

  test-api:
    name: Test API
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.api == 'true'

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: synthtree
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d synthtree"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/synthtree?schema=public

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply database migrations
        working-directory: apps/api
        run: pnpm exec prisma migrate deploy --schema=./prisma/schema.prisma

      - name: Run API tests
        working-directory: apps/api
        run: |
          echo "Running API tests..."
          pnpm test

  build-api:
    name: Build API
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.api == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (validation only)
        run: |
          echo "Building API Docker image..."
          docker buildx build \
            --platform linux/amd64 \
            --file apps/api/Dockerfile \
            --tag api:pr-${{ github.event.pull_request.number }} \
            --load \
            .

          echo "✅ Docker build successful"

  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build theme library
        working-directory: packages/theme
        run: pnpm build

      - name: Build component library
        working-directory: packages/ui
        run: pnpm build

      - name: Reinstall dependencies (after building libs)
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        working-directory: apps/admin-dashboard
        env:
          VITE_API_URL: https://api.dev.synth-tree.com
          VITE_ENVIRONMENT: dev
        run: |
          echo "Building frontend..."
          pnpm build

          if [ ! -d "dist" ] || [ -z "$(ls -A dist)" ]; then
            echo "❌ Build failed"
            exit 1
          fi

          echo "✅ Frontend build successful"

      - name: Build client frontend
        working-directory: apps/client-frontend
        run: |
          echo "Building client frontend..."
          pnpm build

          if [ ! -d "dist" ] || [ -z "$(ls -A dist)" ]; then
            echo "❌ Client frontend build failed"
            exit 1
          fi

          echo "✅ Client frontend build successful"

      - name: Check bundle size
        working-directory: apps/admin-dashboard
        run: |
          echo "Checking bundle size..."
          BUNDLE_SIZE=$(du -sh dist | cut -f1)
          echo "Bundle size: $BUNDLE_SIZE"

  build-storybook:
    name: Build Storybook
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.ui == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build theme library
        working-directory: packages/theme
        run: pnpm build

      - name: Build component library
        working-directory: packages/ui
        run: pnpm build

      - name: Build Storybook
        working-directory: packages/ui
        run: |
          echo "Building Storybook..."
          pnpm build-storybook

          if [ ! -d "storybook-static" ] || [ -z "$(ls -A storybook-static)" ]; then
            echo "❌ Build failed"
            exit 1
          fi

          echo "✅ Storybook build successful"

  validate-infra:
    name: Validate Infrastructure
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run CDK synth
        working-directory: apps/infra
        run: |
          echo "Synthesizing CDK stacks..."
          pnpm build
          npx cdk synth --context environment=dev --all
          echo "✅ CDK synth successful"

      - name: Run infrastructure tests
        working-directory: apps/infra
        run: |
          echo "Running infrastructure tests..."
          pnpm test

  summary:
    name: PR Validation Summary
    runs-on: ubuntu-latest
    needs:
      [
        changes,
        lint-and-typecheck,
        test-api,
        build-api,
        build-frontend,
        build-storybook,
        validate-infra,
      ]
    if: always()
    steps:
      - name: Check results
        env:
          # Skipped jobs (path filter didn't match) are fine; a failed or
          # cancelled job — including Detect Changes, which would otherwise
          # silently skip everything downstream — fails the summary.
          ANY_FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          echo "## PR Validation Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Detect Changes: ${{ needs.changes.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Lint & Type Check: ${{ needs.lint-and-typecheck.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- API Tests: ${{ needs.test-api.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- API Build: ${{ needs.build-api.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Frontend Build: ${{ needs.build-frontend.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Storybook Build: ${{ needs.build-storybook.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Infrastructure Validation: ${{ needs.validate-infra.result }}" >> $GITHUB_STEP_SUMMARY

          if [[ "$ANY_FAILED" == "true" ]]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "❌ Some validation checks failed or were cancelled. Please review the errors above." >> $GITHUB_STEP_SUMMARY
            exit 1
          else
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "✅ All validation checks passed!" >> $GITHUB_STEP_SUMMARY
          fi
