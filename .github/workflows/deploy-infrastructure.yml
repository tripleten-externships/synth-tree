name: Deploy Infrastructure

# Reusable + manual only. Auto-deploys run through deploy-orchestrator.yml
# (push to development -> dev, push to main -> prod). Manual runs from the
# Actions tab are gated to code owners by the require-codeowner action.

on:
  workflow_call:
    inputs:
      environment:
        description: "Environment to deploy (dev or prod)"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy"
        required: true
        type: choice
        options:
          - dev
          - prod

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-infrastructure-${{ inputs.environment }}
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  NODE_VERSION: "24"
  PNPM_VERSION: "10"

jobs:
  deploy:
    name: Deploy (${{ inputs.environment }})
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Restrict manual runs to code owners
        uses: ./.github/actions/require-codeowner

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ inputs.environment == 'prod' && secrets.AWS_ACCESS_KEY_ID_PROD || secrets.AWS_ACCESS_KEY_ID_DEV }}
          aws-secret-access-key: ${{ inputs.environment == 'prod' && secrets.AWS_SECRET_ACCESS_KEY_PROD || secrets.AWS_SECRET_ACCESS_KEY_DEV }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Check CDK bootstrap
        working-directory: apps/infra
        run: |
          echo "Checking CDK bootstrap status..."
          if ! aws cloudformation describe-stacks --stack-name CDKToolkit --region ${{ env.AWS_REGION }} > /dev/null 2>&1; then
            echo "⚠️ CDK not bootstrapped. Run: npx cdk bootstrap"
            exit 1
          fi
          echo "✅ CDK bootstrap verified"

      - name: Ensure database credentials secret exists
        run: |
          SECRET_ID="synth-tree-${{ inputs.environment }}/database/credentials"
          if aws secretsmanager describe-secret --secret-id "$SECRET_ID" --region ${{ env.AWS_REGION }} > /dev/null 2>&1; then
            echo "✅ Secret $SECRET_ID already exists — leaving it untouched."
          else
            echo "Secret $SECRET_ID not found — creating with a generated password."
            PASSWORD=$(aws secretsmanager get-random-password \
              --region ${{ env.AWS_REGION }} \
              --password-length 32 \
              --exclude-characters '"@/\' \
              --require-each-included-type \
              --query RandomPassword --output text)
            SECRET_STRING=$(PASSWORD="$PASSWORD" node -e 'process.stdout.write(JSON.stringify({ username: "postgres", password: process.env.PASSWORD }))')
            aws secretsmanager create-secret \
              --name "$SECRET_ID" \
              --region ${{ env.AWS_REGION }} \
              --description "Database credentials for synth-tree-${{ inputs.environment }} environment" \
              --secret-string "$SECRET_STRING"
            echo "✅ Created $SECRET_ID."
          fi

      - name: Build and deploy
        working-directory: apps/infra
        run: |
          pnpm build
          npx cdk deploy \
            --context environment=${{ inputs.environment }} \
            --all \
            --require-approval never \
            --concurrency 3 \
            --progress events

      - name: Save deployment outputs
        run: |
          aws cloudformation describe-stacks \
            --region ${{ env.AWS_REGION }} \
            --query 'Stacks[?starts_with(StackName, `synth-tree-${{ inputs.environment }}-`)].{Name:StackName, Outputs:Outputs}' \
            > deployment-outputs-${{ inputs.environment }}.json
          echo "Deployment outputs saved"
          cat deployment-outputs-${{ inputs.environment }}.json

      - name: Upload deployment outputs
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.environment }}-deployment-outputs
          path: apps/infra/deployment-outputs-${{ inputs.environment }}.json
          retention-days: 30
